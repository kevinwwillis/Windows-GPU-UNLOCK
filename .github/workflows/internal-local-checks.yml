name: Experimental internal LOCAL checks
on:
  pull_request:
    paths:
      - 'internal-boot/**'
      - 'research/headless/**'
      - 'research/msi-x570-3090/prestep/**'
      - '.github/workflows/internal-local-checks.yml'
  workflow_dispatch:
jobs:
  prestep-mocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic partition identities
        run: |
          cat > internal-boot/boot/platform-config.h <<'EOF'
          /* Synthetic test GUIDs; not a hardware configuration. */
          #define GU_INTERNAL_PARTITION_INITIALIZER {0x11111111,0x1111,0x1111,{0x11,0x11,0x11,0x11,0x11,0x11,0x11,0x11}}
          #define GU_WINDOWS_PARTITION_INITIALIZER {0x22222222,0x2222,0x2222,{0x22,0x22,0x22,0x22,0x22,0x22,0x22,0x22}}
          EOF
      - name: Test USB and internal pre-step failure gates
        run: bash research/msi-x570-3090/prestep/test-internal-prestep.sh
  windows-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check invalid partition and mode rejection
        shell: powershell
        run: ./research/headless/test-local-internal-guard.ps1
